name: luseepy-test
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  # Enable manual activation, too
  workflow_dispatch:
jobs:
  luseepy-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    env:
      PYTHONPATH: .:..
      LUSEE_DRIVE_DIR: Drive
      LUSEE_OUTPUT_DIR: ./output
      JAX_ENABLE_X64: "True"
      MPLCONFIGDIR: /tmp/matplotlib
      UV_CACHE_DIR: /tmp/uv-cache
      LUSEE_LUNAR_DAY_REGRESSION_DAYS: "0.5"
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y curl wget gfortran build-essential pkg-config cmake libopenblas-dev libfftw3-dev
      - run: curl -LsSf https://astral.sh/uv/install.sh | env UV_NO_MODIFY_PATH=1 sh
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: uv sync
      # Four-port-only Drive snapshot (2026-08 reorganisation): the BGL_v16
      # response, the Model54 electronics, and the ULSA sky. The deprecated
      # legacy scalar beams are absent; tests that need them skip. The
      # drive.usercontent endpoint with confirm=t serves large files directly
      # (the plain uc?export=download link returns an interstitial page).
      - run: wget -q "https://drive.usercontent.google.com/download?id=1--Vn75Ip4uVFBD39oSD2WnDHeJny33kW&export=download&confirm=t" -O drive.tbz2
      - run: tar xjf drive.tbz2
      - run: uv run pytest tests/ -v -m "not manual and not slow"
      - run: uv run pytest tests/test_lunar_28day_Cro_vs_default.py -v
      - run: cd simulation; ln -s ../Drive .; mkdir -p output; uv run python driver/run_sim.py config/four_port_example.yaml; ls -l output
      - run: uv run python tests/SimReadTest.py simulation/output/four_port_covariance.fits
