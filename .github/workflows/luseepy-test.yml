name: luseepy-test
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  # Enable manual activation, too
  workflow_dispatch:
jobs:
  luseepy-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    env:
      PYTHONPATH: .:..
      LUSEE_DRIVE_DIR: Drive
      LUSEE_OUTPUT_DIR: ./output
      JAX_ENABLE_X64: "True"
      MPLCONFIGDIR: /tmp/matplotlib
      UV_CACHE_DIR: /tmp/uv-cache
      LUSEE_LUNAR_DAY_REGRESSION_DAYS: "0.5"
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y curl wget gfortran build-essential pkg-config cmake libopenblas-dev libfftw3-dev
      - run: curl -LsSf https://astral.sh/uv/install.sh | env UV_NO_MODIFY_PATH=1 sh
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: uv sync
      - run: wget "https://drive.google.com/uc?export=download&id=1PbU432IYAFSzOjWRrKMoGFR6F1M3dmaV" -O drive.tgz
      - run: tar zxvf drive.tgz
      # The CI Drive snapshot predates the 2026-08 Drive reorganisation that
      # renamed Simulations/BeamModels to Simulations/OldBeamModels (BeamModels
      # now carries the four-port BGL_v16 responses, which are too large to
      # snapshot). Adapt an old-layout snapshot in place; this is a no-op once
      # the snapshot is regenerated from the reorganised Drive.
      - run: |
          if [ -d Drive/Simulations/BeamModels/LanderRegolithComparison ]; then
            mv Drive/Simulations/BeamModels Drive/Simulations/OldBeamModels
          fi
      - run: uv run pytest tests/ -v -m "not manual and not slow"
      - run: uv run pytest tests/test_lunar_28day_Cro_vs_default.py -v
      - run: cd simulation; ln -s ../Drive .; mkdir -p output; uv run python driver/run_sim.py config/example.yaml; ls -l output
      - run: uv run python tests/SimReadTest.py simulation/output/sim_example.fits
